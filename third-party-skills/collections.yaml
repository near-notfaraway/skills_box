# 第三方技能集合来源索引，一集合一条记录，不保存上游文件副本。
# 成员路径为 <source.skill_root>/<members 中的名称>/SKILL.md。
# 安装时获取上游最新内容，成员清单以安装时的上游文件为准。
collections:
  - name: ponytail
    category: 开发
    tags:
      - 最小实现
      - 代码质量
      - 重构
      - 代码审查
      - 开发工作流
    summary: 以最小完整改动完成编码、修复、重构和审查任务的六个 Skill 集合，并提供可选的 Agent 插件与生命周期 Hook。
    source:
      repository: https://github.com/DietrichGebert/ponytail
      format: claude-code-plugin
      skill_root: skills
    members:
      - ponytail
      - ponytail-review
      - ponytail-audit
      - ponytail-debt
      - ponytail-gain
      - ponytail-help
    install:
      mode: member-skills-or-plugin
      instructions:
        - 只安装六个独立 Skill 时，使用 npx --registry=https://registry.npmjs.org --yes skills@latest add https://github.com/DietrichGebert/ponytail --skill '*' -g，并保留 skills/<成员名>/SKILL.md 的成员结构。
        - 需要完整插件能力时获取上游完整仓库，按 INSTALL.md 使用对应平台的插件安装方式；完整仓库还包含 AGENTS.md、插件清单和生命周期 Hook。
    notes: >
      集合成员路径统一为 skills/<成员名>/SKILL.md。Skill 成员可独立加载；
      Claude Code、Codex 等插件安装会额外启用上游定义的规则注入、Hook 和插件命令。
